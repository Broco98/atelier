[package]
name = "atelier-app"
version = "0.11.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atelier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: 본문 이미지가 로컬 파일을 읽는 통로. 켜는 곳이 둘이고
# (여기와 tauri.conf.json의 assetProtocol) 한쪽만 있으면 빌드가 거부한다.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atelier-core = { path = "../crates/atelier-core" }
tauri-plugin-dialog = "2"
notify-debouncer-mini = "0.7"
# PTY는 데스크톱 앱만 쓴다 — MCP·CLI가 쓸 일이 없어 워크스페이스 공용으로 올리지 않는다.
# libc는 회수 경로의 killpg 하나 때문에 직접 든다.
portable-pty = "0.9"
libc = "0.2"

