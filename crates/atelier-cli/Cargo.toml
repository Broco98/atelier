[package]
name = "atelier-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
atelier-core = { path = "../atelier-core" }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
