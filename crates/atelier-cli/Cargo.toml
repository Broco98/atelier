[package]
name = "atelier-cli"
version = "0.7.0"
edition = "2021"

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
atelier-core = { path = "../atelier-core" }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std"] }
serde = { workspace = true }
tracing-subscriber = "0.3"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
